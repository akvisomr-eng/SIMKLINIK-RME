name: Sinkronisasi Kode Web dari RUNDINGAN-KREASI-MEDIA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil 7 file terbaru
        run: |
          set -euo pipefail
          SRC="https://raw.githubusercontent.com/akvisomr-eng/RUNDINGAN-KREASI-MEDIA/arena/82c43d8c-rundingan-kreasi-media/apps/terapi-wicara-web"
          DST="apps/terapi-wicara-web"
          mkdir -p "$DST/src/components"
          curl -fsSL "$SRC/app/simklinik/page.tsx"                      -o "$DST/app/simklinik/page.tsx"
          curl -fsSL "$SRC/app/globals.css"                             -o "$DST/app/globals.css"
          curl -fsSL "$SRC/src/components/ClinicOperatingDashboard.tsx" -o "$DST/src/components/ClinicOperatingDashboard.tsx"
          curl -fsSL "$SRC/src/components/SatusehatBridgeModule.tsx"    -o "$DST/src/components/SatusehatBridgeModule.tsx"
          curl -fsSL "$SRC/src/components/RbacAuditModule.tsx"          -o "$DST/src/components/RbacAuditModule.tsx"
          curl -fsSL "$SRC/src/components/FormulirCrud.tsx"             -o "$DST/src/components/FormulirCrud.tsx"
          curl -fsSL "$SRC/src/lib/formSchemas.ts"                      -o "$DST/src/lib/formSchemas.ts"
      - name: Commit
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -A
          git commit -m "feat(simklinik): 16 modul interaktif, dasbor operasional, SATUSEHAT & audit PDP"
          git push
