name: Migrasi kanal kode dengan tiga saluran log

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrasi-sekali.yml'



permissions:
  contents: write

jobs:
  migrasi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API: https://fawmudsaaotlqyryciwd.supabase.co
      KEY: sb_publishable_wRGUQNJKi5XUjMXHFpDxVw_hPAPyhUc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/terapi-wicara-web/package-lock.json

      - name: 1. Tulis berkas dari kanal
        run: |
          set -euo pipefail
          curl -fsSL "$API/rest/v1/simklinik_code_files?select=path,content" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /tmp/all.json
          python3 - <<'PY'
          import json, os
          web = "apps/terapi-wicara-web"
          rows = json.load(open("/tmp/all.json"))
          assert len(rows) >= 20, "kanal terlalu sedikit: %d" % len(rows)
          for row in rows:
              p = row["path"]
              dst = os.path.join(web, p) if p.startswith(("app/", "src/")) else p
              os.makedirs(os.path.dirname(dst) or ".", exist_ok=True)
              with open(dst, "w", encoding="utf-8") as fh:
                  fh.write(row["content"])
              print("tulis", dst)
          print("total", len(rows))
          PY

      - name: 2. Buang workflow lama
        run: |
          for f in sinkron-web sinkron-otomatis diagnosa-build; do
            if [ -f ".github/workflows/$f.yml" ]; then
              rm -f ".github/workflows/$f.yml"
              echo "dibuang: $f.yml"
            fi
          done

      - name: 3. Gabungkan tema ke globals.css
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib

          web = "apps/terapi-wicara-web"
          css = pathlib.Path(web) / "app" / "globals.css"
          theme = pathlib.Path(web) / "app" / "theme-eduwell.css"
          assert css.exists(), "globals.css tidak ada"
          assert theme.exists(), "theme-eduwell.css tidak ada"

          START = "/* === EDUWELL THEME START === */"
          END = "/* === EDUWELL THEME END === */"
          TSTART = "/* === EDUWELL TAIL START === */"
          TEND = "/* === EDUWELL TAIL END === */"

          def buang_blok(baris, awal, akhir):
              hasil, lewati = [], False
              for b in baris:
                  if b.strip() == awal:
                      lewati = True
                      continue
                  if b.strip() == akhir:
                      lewati = False
                      continue
                  if not lewati:
                      hasil.append(b)
              return hasil

          lama = css.read_text(encoding="utf-8").splitlines()
          lama = buang_blok(lama, START, END)
          lama = buang_blok(lama, TSTART, TEND)
          tema = theme.read_text(encoding="utf-8").strip().splitlines()

          ekor = [
              "html, body { background-color: #FFFFFF; color: #14161A; }",
              "body { font-family: 'Open Sans', system-ui, sans-serif; }",
              "::selection { background: #DC8CDB; color: #fff; }",
          ]

          out = [START] + tema + [END, ""] + lama + ["", TSTART] + ekor + [TEND]
          isi = "\n".join(out).strip() + "\n"
          css.write_text(isi, encoding="utf-8")

          assert "ew-hero" in isi, "tema tidak tergabung"
          assert isi.count(START) == 1, "penanda tema ganda"
          print("globals.css:", len(isi), "karakter")
          PY

      - name: 4. Aktifkan output standalone
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("apps/terapi-wicara-web/next.config.ts")
          s = p.read_text(encoding="utf-8")
          if "standalone" not in s:
              s = s.replace(
                  "poweredByHeader: false,",
                  "poweredByHeader: false,\n  output: 'standalone',",
              )
              p.write_text(s, encoding="utf-8")
          print(s)
          PY

      - name: 5. Pasang dependensi
        working-directory: apps/terapi-wicara-web
        run: npm install --no-audit --no-fund

      - name: 5b. Siapkan cadangan huruf bila next/font gagal
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("apps/terapi-wicara-web/app/layout.tsx")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r"^import \{ Plus_Jakarta_Sans \}.*?\n", "", s, flags=re.M)
          s = re.sub(r"^const jakarta = Plus_Jakarta_Sans\([\s\S]*?^\);\n", "", s, flags=re.M)
          s = s.replace(" className={jakarta.variable}", "")
          pathlib.Path("/tmp/layout-sistem.tsx").write_text(s, encoding="utf-8")
          print("cadangan huruf sistem disiapkan")
          PY

      - name: 6. Build produksi
        working-directory: apps/terapi-wicara-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fawmudsaaotlqyryciwd.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wRGUQNJKi5XUjMXHFpDxVw_hPAPyhUc
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set +e
          npx next build 2>&1 | tee /tmp/build.log
          kode=${PIPESTATUS[0]}
          if [ "$kode" -ne 0 ] && grep -qiE 'font|google' /tmp/build.log; then
            echo "::warning::build gagal saat mengunduh huruf, ulangi dengan huruf sistem"
            cp /tmp/layout-sistem.tsx apps/terapi-wicara-web/app/layout.tsx
            npx next build 2>&1 | tee /tmp/build.log
            kode=${PIPESTATUS[0]}
          fi
          tail -c 20000 /tmp/build.log > /tmp/build-tail.log 2>/dev/null || true
          echo "KODE_BUILD=$kode" >> "$GITHUB_ENV"
          echo "kode keluar build: $kode"
          exit $kode

      # ---------------------------------------------------------------------
      # TIGA SALURAN LOG
      #
      # 6b ringkasan run  : tanpa jaringan, tidak bisa gagal diam-diam
      # 6c artifact       : bisa Anda unduh dan kirim ke saya
      # 6d kanal Supabase : saya baca sendiri dari database
      #
      # Ketiganya if: always(). Penyebab run #3 tidak meninggalkan jejak adalah
      #         if: always() pada langkah pengirim: ia bisa terlewat begitu saja.
      # ---------------------------------------------------------------------
      - name: 6b. Terbitkan ringkasan log ke halaman run
        if: always()
        run: |
          ekor=/tmp/build-tail.log
          if [ ! -s "$ekor" ]; then
            echo "log build tidak terbentuk atau kosong" > /tmp/kosong.log
            ekor=/tmp/kosong.log
          fi
          {
            echo "## Hasil build"
            echo ""
            echo "- Kode keluar: ${KODE_BUILD:-tidak diketahui}"
            echo "- Waktu: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo '```'
            tail -c 6000 "$ekor"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ringkasan ditulis ke GITHUB_STEP_SUMMARY"

      - name: 6c. Unggah log sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-tail.log
          if-no-files-found: warn
          retention-days: 7

      - name: 6d. Kirim log ke kanal Supabase
        if: always()
        run: |
          set +e
          if [ -s /tmp/build-tail.log ]; then ekor=/tmp/build-tail.log; else ekor=/dev/null; fi
          isi=$(tail -c 14000 "$ekor" 2>/dev/null)
          for coba in 1 2 3; do
            kode=$(curl -s -o /tmp/ci.out -w '%{http_code}' \
              -X POST "$API/rest/v1/rpc/tw_ci_log" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              --data-binary "$(python3 -c '
          import json, os, sys
          isi = sys.stdin.read()
          print(json.dumps({"p_run": os.environ.get("GITHUB_RUN_ID", "?"),
                            "p_step": "next build kode=" + os.environ.get("KODE_BUILD", "?"),
                            "p_body": isi}))
          ' <<< "$isi")")
            echo "percobaan $coba: HTTP $kode"
            if [ "$kode" = "200" ] || [ "$kode" = "204" ]; then break; fi
            sleep 3
          done
          cat /tmp/ci.out 2>/dev/null || true
          exit 0

      - name: 7. Pemeriksaan tipe
        working-directory: apps/terapi-wicara-web
        run: npx tsc --noEmit

      - name: 8. Buktikan halaman baru dirender
        working-directory: apps/terapi-wicara-web
        run: |
          set -euo pipefail
          find .next/server/app -name "*.html" | sort
          hero=""
          for f in $(find .next/server/app -name "*.html"); do
            if grep -q "ew-hero" "$f"; then hero="$f"; break; fi
          done
          echo "halaman bertema EduWell: ${hero:-TIDAK ADA}"
          if [ -z "$hero" ]; then
            echo "::error::Tema EduWell tidak ditemukan pada HTML hasil build"
            exit 1
          fi
          if grep -q "SIMKLINIK Cabang" "$hero"; then
            echo "::error::Tombol SIMKLINIK Cabang masih ada di situs publik"
            exit 1
          fi
          echo "lulus: tema terpasang dan tombol dasbor sudah hilang"

      - name: 9. Commit dan dorong
        run: |
          set -euo pipefail
          git config user.name arena-agent
          git config user.email arena-agent@users.noreply.github.com

          git add -A -- . ':(exclude).github'

          if git diff --cached --quiet; then
            echo "tidak ada perubahan untuk di-commit"
            exit 0
          fi

          git commit -m "feat(web): situs publik EduWell dengan ilustrasi, pisahkan dasbor ke halaman masuk"

          git pull --rebase --autostash origin main
          git push
          echo "commit didorong, Vercel akan membangun ulang"
          fi
